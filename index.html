<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OMGym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>OMGym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 680px) with a fixed bottom tab bar, like a gym log app. */
:root {
  --bg: #F3F5F2; --surface: #FFFFFF; --sunk: #E8ECE7; --fg: #14211C; --muted: #56655E; --line: #D5DCD6;
  --iron: #1D5B48; --on-iron: #FFFFFF; --mango: #E3961B; --mango-ink: #7A4A00;
  --good: #2C7A4C; --warn: #9C6210; --bad: #B23A2E; --good-bg: #E1F0E6; --warn-bg: #FAEFD9; --bad-bg: #F8E2DF;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1512; --surface: #16201C; --sunk: #1D2924; --fg: #E6EEE9; --muted: #9AABA3; --line: #29372F;
  --iron: #5BBE97; --on-iron: #06120D; --mango: #F2A93B; --mango-ink: #F6C67A;
  --good: #6CC58F; --warn: #E3A94A; --bad: #EE7A6C; --good-bg: #15291E; --warn-bg: #2D2414; --bad-bg: #33191A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1512; --surface: #16201C; --sunk: #1D2924; --fg: #E6EEE9; --muted: #9AABA3; --line: #29372F;
  --iron: #5BBE97; --on-iron: #06120D; --mango: #F2A93B; --mango-ink: #F6C67A;
  --good: #6CC58F; --warn: #E3A94A; --bad: #EE7A6C; --good-bg: #15291E; --warn-bg: #2D2414; --bad-bg: #33191A; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--iron); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: 0.01em; line-height: 1.05; margin: 0; text-wrap: balance; text-transform: uppercase; }
h1 { font-size: 2.1rem; } h2 { font-size: 1.55rem; } h3 { font-size: 1.2rem; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 3px solid var(--mango); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 14px 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: 0.02em; display: flex; align-items: baseline; gap: 2px; }
.brand b { color: var(--mango); }
.status { font-size: 0.78rem; color: var(--muted); text-align: right; }
main { padding-block: 6px 120px; display: grid; gap: 18px; }

.banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.example { background: var(--sunk); }
.flag { border-radius: var(--r); padding: 10px 12px; font-size: 0.9rem; border-left: 4px solid; }
.flag.stop { background: var(--bad-bg); border-color: var(--bad); }
.flag.warn { background: var(--warn-bg); border-color: var(--warn); }
.flag.info { background: var(--sunk); border-color: var(--muted); }

.btn { appearance: none; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; background: var(--iron); color: var(--on-iron); min-height: 44px; }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.small { padding: 6px 12px; min-height: 34px; font-size: 0.85rem; }
.btn.warn { background: var(--bad); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--iron); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.dayhead { display: grid; gap: 4px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border-radius: var(--r); padding: 10px 12px; }
.kpi .v { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; }
.kpi .u { font-size: 0.75rem; color: var(--muted); }

.card { background: var(--surface); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.card.hero { box-shadow: inset 0 0 0 2px var(--iron); }
.cardhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pill { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 3px 8px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.survey { background: var(--good-bg); color: var(--good); }
.pill.market { background: var(--good-bg); color: var(--good); }
.pill.retail { background: var(--sunk); color: var(--fg); }
.pill.estimate, .pill.placeholder { background: var(--warn-bg); color: var(--warn); }
.pill.yours { background: var(--iron); color: var(--on-iron); }
.pill.done { background: var(--iron); color: var(--on-iron); }

.block { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.block:first-of-type { border-top: 0; padding-top: 0; }
.blockhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.blockhead h3 { font-size: 1.05rem; }
.lines { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
.ex:first-of-type { border-top: 0; }
.ex .name { font-weight: 700; }
.ex .rx { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.88rem; }
.ex details { grid-column: 1 / -1; font-size: 0.88rem; color: var(--muted); }
.ex summary { cursor: pointer; color: var(--iron); font-weight: 600; width: max-content; }
.sets { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; align-items: center; }
.setbox { width: 36px; height: 36px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; cursor: pointer; color: var(--muted); }
.setbox[aria-pressed="true"] { background: var(--iron); border-color: var(--iron); color: var(--on-iron); }
.load { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.load input { width: 84px; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); }
.load .last { font-size: 0.78rem; color: var(--muted); }

.habits { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 0.88rem; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--iron); color: var(--on-iron); border-color: var(--iron); }

.mealrow { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.mealrow:first-of-type { border-top: 0; }

.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.iconbtn { appearance: none; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.2rem; font-weight: 700; }
.macro { display: grid; gap: 4px; }
.bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--iron); border-radius: 4px; }
.bar.over i { background: var(--mango); }
.macros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
td, th { padding: 6px 4px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.how { font-size: 0.9rem; color: var(--muted); }

.shopgrp { display: grid; gap: 2px; }
.shoprow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.shoprow input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--iron); margin-top: 2px; }
.shoprow.ticked .nm { text-decoration: line-through; color: var(--muted); }
.shoprow .src { grid-column: 2 / -1; font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.priceedit { grid-column: 2 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.priceedit input { width: 110px; padding: 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1.05; }
.chart svg { width: 100%; height: auto; display: block; }
.loglist { display: grid; }
.logrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: center; }

.formrow { display: grid; gap: 6px; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.formgrid .full { grid-column: 1 / -1; }
label.f { font-weight: 600; font-size: 0.9rem; }
.f-hint { font-size: 0.8rem; color: var(--muted); }
input[type=number], input[type=text], input[type=date], select { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); min-height: 44px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.err { color: var(--bad); font-size: 0.85rem; font-weight: 600; }
.yn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.92rem; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.tabs button { appearance: none; border: 0; background: none; padding: 10px 2px 12px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--iron); }

.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .wrap { padding-block: 18px 40px; display: grid; gap: 18px; }
.steps { display: flex; gap: 4px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--iron); }
.sheetfoot { display: flex; justify-content: space-between; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; max-width: calc(100% - 32px); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sources { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 0.88rem; }
@media (max-width: 380px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .formgrid { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .setbox, .chip, .btn { transition: background-color .15s, color .15s, border-color .15s; } }
</style>

<div id="app">
  <div class="wrap">
    <header class="top">
      <div class="brand" aria-label="OMGym">OM<b>GYM</b></div>
      <div class="status" id="status">Loading your plan…</div>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
  <nav class="tabs" aria-label="Sections">
    <div class="in">
      <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Today</button>
      <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 6V3M9 13h6"/></svg>Meals</button>
      <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16l-1.5 11h-13z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Shop</button>
      <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/></svg>Progress</button>
      <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Plan</button>
    </div>
  </nav>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script id="core">
/* ===== OMGym core: pure planning logic (no DOM) ===== */
var OM = (function () {
  'use strict';
  var DAY_MS = 864e5;

  /* ---------- dates ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) { var a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
  function dayNum(s) { var d = parseYmd(s); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS); }
  function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function weekday(s) { return parseYmd(s).getDay(); } // 0 = Sunday
  function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return Math.abs(n); }

  /* ---------- body metrics ---------- */
  function navyBodyFat(p) {
    // US Navy circumference method, metric form (cm)
    if (!p.neckCm || !p.waistCm || !p.heightCm) return null;
    var v;
    if (p.sex === 'male') {
      if (p.waistCm - p.neckCm <= 0) return null;
      v = 495 / (1.0324 - 0.19077 * Math.log10(p.waistCm - p.neckCm) + 0.15456 * Math.log10(p.heightCm)) - 450;
    } else {
      if (!p.hipCm || p.waistCm + p.hipCm - p.neckCm <= 0) return null;
      v = 495 / (1.29579 - 0.35004 * Math.log10(p.waistCm + p.hipCm - p.neckCm) + 0.221 * Math.log10(p.heightCm)) - 450;
    }
    if (!isFinite(v) || v < 2 || v > 70) return null;
    return v;
  }
  function bfCategory(bf, sex) {
    // ACE classification
    var t = sex === 'male' ? [6, 14, 18, 25] : [14, 21, 25, 32];
    if (bf < t[0]) return 'Essential fat range';
    if (bf < t[1]) return 'Athletic range';
    if (bf < t[2]) return 'Fitness range';
    if (bf < t[3]) return 'Average range';
    return 'Above average';
  }
  function bmiCategory(b) {
    if (b < 18.5) return 'Underweight'; if (b < 25) return 'Healthy range'; if (b < 30) return 'Overweight'; return 'Obesity range';
  }
  function whtrCategory(r) {
    // NICE NG246
    if (r < 0.4) return 'Below 0.4'; if (r < 0.5) return 'Healthy (0.4–0.49)'; if (r < 0.6) return 'Increased risk (0.5–0.59)'; return 'High risk (0.6+)';
  }

  var NEAT = { desk: 1.2, light: 1.3, onfeet: 1.45, manual: 1.6 };
  var MET = { weights: 5.0, mix: 5.5, cardio: 6.5 };
  var LOSS_RATE = { steady: 0.005, standard: 0.0075, faster: 0.01 };
  var GAIN_RATE = { beginner: 0.0035, intermediate: 0.0025, advanced: 0.0015 };

  function calcTargets(p, kcalAdj) {
    kcalAdj = kcalAdj || 0;
    var w = p.weightKg, h = p.heightCm, a = p.age, male = p.sex === 'male';
    var hm = h / 100;
    var bmr = 10 * w + 6.25 * h - 5 * a + (male ? 5 : -161); // Mifflin-St Jeor
    var neat = NEAT[p.activity] || 1.2;
    var sessKcal = (MET[p.style] || 5) * w * 0.75; // 45 min session
    var days = (p.days || []).length;
    var exDaily = sessKcal * days / 7;
    var tdee = bmr * neat + exDaily;
    var bmi = w / (hm * hm);
    var whtr = p.waistCm ? p.waistCm / h : null;
    var bf = navyBodyFat(p);
    var flags = [];
    var minHealthy = 18.5 * hm * hm;
    var goal = p.goalKg;
    var forceMaintain = false;

    if (a < 18) { forceMaintain = true; flags.push({ level: 'warn', text: 'Calorie targets here are built for adults. Under 18, this plan holds you at maintenance while you build the training habit. Check weight goals with a doctor or school nurse.' }); }
    if (p.pregnant) { forceMaintain = true; flags.push({ level: 'warn', text: 'Pregnant or breastfeeding: the plan stays at maintenance calories, not a deficit. Clear your training plan and food needs with your doctor or midwife.' }); }
    if (goal < minHealthy) {
      flags.push({ level: 'warn', text: 'Your goal weight is below the healthy BMI range for your height (under ' + minHealthy.toFixed(1) + ' kg). The plan aims for ' + minHealthy.toFixed(1) + ' kg instead.' });
      goal = minHealthy;
    }
    var parqYes = (p.parq || []).some(Boolean);
    if (parqYes) flags.push({ level: 'stop', text: 'You answered yes to a health screening question. Talk to your doctor before starting. Until then the workouts keep intensity moderate and skip hard intervals.' });

    var diff = goal - w;
    var goalType = forceMaintain ? 'maintain' : (diff < -1 ? 'lose' : (diff > 1 ? 'gain' : 'maintain'));
    var floor = male ? 1500 : 1200;
    var kcal, plannedRate = 0, floorApplied = false, deficit = 0;

    if (goalType === 'lose') {
      var r = LOSS_RATE[p.pace] || LOSS_RATE.standard;
      deficit = w * r * 7700 / 7;
      deficit = Math.min(deficit, 1000, tdee * 0.25);
      kcal = tdee - deficit;
      if (kcal < floor) { kcal = floor; floorApplied = true; }
    } else if (goalType === 'gain') {
      var g = GAIN_RATE[p.experience] || GAIN_RATE.beginner;
      var surplus = Math.max(150, Math.min(450, w * g * 7700 / 7));
      kcal = tdee + surplus;
    } else {
      kcal = tdee;
    }
    kcal = kcal + kcalAdj;
        kcal = Math.max(kcal, floor);
    kcal = Math.round(kcal / 10) * 10;

    // planned weekly change from the final calorie number
    var dailyDelta = kcal - tdee;
    plannedRate = dailyDelta * 7 / 7700; // kg per week (negative = loss)

    // protein: per kg of a reference weight (adjusted when BMI >= 30)
    var refW = bmi >= 30 ? 27 * hm * hm : w;
    var ppk = goalType === 'lose' ? 2.0 : goalType === 'gain' ? 1.8 : 1.6;
    var protein = Math.round(Math.min(refW * ppk, 230));
    var fat = Math.round(Math.max(kcal * 0.27 / 9, 0.6 * refW));
    var carbs = Math.round((kcal - protein * 4 - fat * 9) / 4);
    if (carbs < 100) { fat = Math.round(Math.max(0.5 * refW, (kcal - protein * 4 - 100 * 4) / 9)); carbs = Math.round((kcal - protein * 4 - fat * 9) / 4); }

    var pSum = meals.reduce(function (a, m) { return a + (m.tot ? m.tot.p : 0); }, 0);
    var short = T.protein - pSum;
    if (short > 0.05 * T.protein) {
      var leanMeals = meals.filter(function (m) { return m.tot && ING[m.protId].p / ING[m.protId].k >= 0.09; });
      leanMeals.forEach(function (m) {
        var items2 = solveMeal(m.tpl, m.protId, m.carbId, m.kT, m.pT + short / leanMeals.length, ex);
        var tot2 = mealTotals(items2, pt);
        if (tot2.p > m.tot.p) { m.items = items2; m.tot = tot2; }
      });
    }
    var day = { k: 0, p: 0, c: 0, f: 0, cost: 0 };
    meals.forEach(function (m) { if (m.tot) ['k', 'p', 'c', 'f', 'cost'].forEach(function (x) { day[x] += m.tot[x]; }); });
    return { date: dateStr, meals: meals, tot: day };
  }

  function shoppingList(startDate, nDays, p, T, pt, swaps) {
    var need = {};
    var total = 0, days = [];
    for (var i = 0; i < nDays; i++) {
      var d = addDays(startDate, i);
      var plan = planDay(d, p, T, pt, swaps);
      days.push(plan);
      plan.meals.forEach(function (m) { (m.items || []).forEach(function (it) { need[it.id] = (need[it.id] || 0) + it.buyG; }); });
    }
    var rows = Object.keys(need).map(function (id) {
      var it = pt.items[id], g = need[id];
      var qty, cost, qtyText;
      if (it.loose) {
        var lb = g / 453.6;
        var lbR = Math.max(0.25, Math.ceil(lb * 4) / 4);
        qty = lbR; cost = lbR * 453.6 * it.pr / it.g;
        qtyText = lbR.toFixed(2).replace(/\.?0+$/, '') + ' lb (' + Math.round(lbR * 0.4536 * 100) / 100 + ' kg)';
      } else {
        qty = Math.max(1, Math.ceil(g / it.g - 0.05));
        cost = qty * it.pr; qtyText = qty + ' × ' + it.u;
      }
      total += cost;
      return { id: id, name: ING[id].name, grp: ING[id].grp, needG: g, qty: qty, qtyText: qtyText, cost: cost, price: it };
    });
    var order = ['Proteins', 'Starches', 'Ground provisions', 'Vegetables & fruit', 'Pantry'];
    rows.sort(function (a, b) { return order.indexOf(a.grp) - order.indexOf(b.grp) || b.cost - a.cost; });
    var eaten = days.reduce(function (a, d) { return a + d.tot.cost; }, 0);

  }

  /* ---------- progress ---------- */
  function trend(weights, todayStr, windowDays) {
    windowDays = windowDays || 21;
    var t0 = dayNum(todayStr);
    var pts = weights.filter(function (w) { var dn = dayNum(w.d); return dn <= t0 && dn > t0 - windowDays; }).map(function (w) { return [dayNum(w.d), w.kg]; });
    if (pts.length < 4) return null;
    var span = pts[pts.length - 1][0] - pts[0][0];
    var xs = pts.map(function (q) { return q[0]; });
    if (Math.max.apply(null, xs) - Math.min.apply(null, xs) < 10) return null;
    var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
    pts.forEach(function (q) { sx += q[0]; sy += q[1]; sxx += q[0] * q[0]; sxy += q[0] * q[1]; });
    var slope = (n * sxy - sx * sy) / (n * sxx - sx * sx);
    var mean = sy / n;
    return { perWeek: slope * 7, n: n, span: span, mean: mean };
  }

  function suggestAdjust(T, tr, w) {
    if (!tr) return null;
    var planned = T.plannedWeeklyKg, actual = tr.perWeek;
    if (T.goalType === 'lose') {
      if (actual > planned * 0.4 && !T.floorApplied) return { delta: -150, why: 'You are losing ' + Math.abs(actual).toFixed(2) + ' kg/week against a plan of ' + Math.abs(planned).toFixed(2) + ' kg. A small cut of 150 kcal should get things moving.' };
      if (actual < -0.012 * w) return { delta: 150, why: 'You are losing faster than 1.2% of body weight a week. Adding 150 kcal protects muscle and energy.' };
    } else if (T.goalType === 'gain') {
      if (actual < planned * 0.4) return { delta: 100, why: 'Weight is climbing slower than planned. Add 100 kcal.' };
      if (actual > planned * 2) return { delta: -100, why: 'Weight is climbing faster than planned, so more of it is likely fat. Remove 100 kcal.' };
    } else {
      if (actual > 0.0025 * w) return { delta: -100, why: 'Your weight is creeping up. Trim 100 kcal to hold steady.' };
      if (actual < -0.0025 * w) return { delta: 100, why: 'Your weight is drifting down. Add 100 kcal to hold steady.' };
    }
    return null;
  }

  return {
    ymd: ymd, parseYmd: parseYmd, dayNum: dayNum, addDays: addDays, weekday: weekday,
    navyBodyFat: navyBodyFat, calcTargets: calcTargets, buildWorkout: buildWorkout, sessionFor: sessionFor,
    candidates: candidates, EX: EX, ING: ING, PRICES: PRICES, MEALS: MEALS, SLOTS: SLOTS,
    priceTable: priceTable, planDay: planDay, shoppingList: shoppingList, excludedTags: excludedTags,
    trend: trend, suggestAdjust: suggestAdjust, slotOptions: slotOptions, LOSS_RATE: LOSS_RATE
  };
})();
if (typeof module !== 'undefined') module.exports = OM;

<script id="ui">

    h += '<section class="card">';
    sl.rows.forEach(function (r) {

      var t = !!ticks[r.id];
      h += '<div class="shoprow' + (t ? ' ticked' : '') + '"><input type="checkbox" id="tick-' + r.id + '" data-act="tick" data-id="' + r.id + '"' + (t ? ' checked' : '') + ' aria-label="Bought ' + esc(r.name) + '"><label for="tick-' + r.id + '"><span class="nm"><strong>' + esc(r.name) + '</strong></span><br><span class="small num">' + esc(r.qtyText) + '</span></label><span class="num"><strong>' + money(r.cost, pt) + '</strong></span>';

  function chartSvg(ws, T) {
    if (ws.length < 2) return '<p class="muted small">Log at least two weigh-ins to see your chart.</p>';
    var W = 400, H = 220, L = 40, R = 8, Tp = 16, B = 26;
    var xs = ws.map(function (w) { return OM.dayNum(w.d); }), ys = ws.map(function (w) { return wtv(w.kg); });
    var goal = wtv(T.goalKg);
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs); if (x1 === x0) x1 = x0 + 1;
    var lo = Math.min.apply(null, ys.concat([goal])), hi = Math.max.apply(null, ys.concat([goal]));
    var pad = Math.max(0.5, (hi - lo) * 0.08); lo -= pad; hi += pad;
    var sx = function (x) { return L + (x - x0) / (x1 - x0) * (W - L - R); };
    var sy = function (y) { return Tp + (hi - y) / (hi - lo) * (H - Tp - B); };
    var step = (hi - lo) / 4, g = '';
    for (var i = 0; i <= 4; i++) { var v = lo + step * i, yy = sy(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="12" fill="var(--muted)">' + v.toFixed(1) + '</text>'; }
    // 7-day rolling average
    var avg = ws.map(function (w, i) { var dn = xs[i]; var win = ws.filter(function (u, j) { return xs[j] <= dn && xs[j] > dn - 7; }); return [dn, win.reduce(function (a, u) { return a + wtv(u.kg); }, 0) / win.length]; });
    var path = avg.map(function (q, i) { return (i ? 'L' : 'M') + sx(q[0]).toFixed(1) + ' ' + sy(q[1]).toFixed(1); }).join(' ');
    var area = path + ' L' + sx(avg[avg.length - 1][0]).toFixed(1) + ' ' + (H - B) + ' L' + sx(avg[0][0]).toFixed(1) + ' ' + (H - B) + ' Z';
    var dots = ws.map(function (w, i) { return '<circle cx="' + sx(xs[i]).toFixed(1) + '" cy="' + sy(ys[i]).toFixed(1) + '" r="3" fill="var(--muted)" opacity="0.7"/>'; }).join('');
    var last = avg[avg.length - 1];
    var gy = sy(goal);
    var lbl = '<text x="' + L + '" y="' + (H - 8) + '" font-size="12" fill="var(--muted)">' + esc(niceDate(ws[0].d, { day: 'numeric', month: 'short' })) + '</text><text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end" font-size="12" fill="var(--muted)">' + esc(niceDate(ws[ws.length - 1].d, { day: 'numeric', month: 'short' })) + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weight trend chart">' + g +
      '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--mango)" stroke-width="2" stroke-dasharray="6 5"/><text x="' + (W - R) + '" y="' + (gy - 6) + '" text-anchor="end" font-size="12" font-weight="700" fill="var(--mango-ink)">Goal ' + goal.toFixed(1) + '</text>' +
      '<path d="' + area + '" fill="var(--iron)" opacity="0.08"/><path d="' + path + '" fill="none" stroke="var(--iron)" stroke-width="2.5" stroke-linejoin="round"/>' + dots +
      '<circle cx="' + sx(last[0]).toFixed(1) + '" cy="' + sy(last[1]).toFixed(1) + '" r="5" fill="var(--iron)" stroke="var(--surface)" stroke-width="2"/>' + lbl + '</svg>';
  }

    } else if (step === 3) {
      h += '<p class="muted">From the PAR-Q+ screening questionnaire. A "yes" doesn\'t stop you training; it means check with your doctor first, and the plan keeps intensity moderate.</p><div>';
      PARQ.forEach(function (q, i) { h += '<div class="yn"><span>' + esc(q) + '</span>' + seg('parq' + i, [['no', 'No'], ['yes', 'Yes']], d.parq[i] ? 'yes' : 'no') + '</div>'; });
      if (d.sex === 'female') h += '<div class="yn"><span>Pregnant or breastfeeding</span>' + seg('pregnant', [['no', 'No'], ['yes', 'Yes']], d.pregnant ? 'yes' : 'no') + '</div>';
      h += '</div><div class="formrow"><span class="f">Any of these that hurt or have been injured?</span>' + multi('injuries', [['knees', 'Knees'], ['back', 'Lower back'], ['shoulders', 'Shoulders']], d.injuries) + '<span class="f-hint">Exercises that load these areas are swapped for kinder versions.</span></div>';
    } else if (step === 4) {
      h += '<div class="formrow"><span class="f">Where do you shop?</span>' + seg('region', [['JM', 'Jamaica (J$)'], ['US', 'United States ($)'], ['OTHER', 'Somewhere else']], d.region) + '</div>';
      if (d.region === 'OTHER') h += '<div class="formgrid"><div class="formrow"><label class="f" for="regionName">Country or city</label><input id="regionName" data-k="regionName" type="text" value="' + esc(d.regionName || '') + '"></div><div class="formrow"><label class="f" for="currencySymbol">Currency symbol</label><input id="currencySymbol" data-k="currencySymbol" type="text" maxlength="4" value="' + esc(d.currencySymbol || '$') + '"></div></div><p class="small muted">You will enter local prices on the Shop tab. Until then, US prices stand in.</p>';
      h += '<div class="formrow"><span class="f">How do you eat?</span>' + seg('diet', [['none', 'Everything'], ['pescatarian', 'Fish, no meat'], ['vegetarian', 'Vegetarian'], ['vegan', 'Vegan']], d.diet) + '</div>';
      h += '<div class="formrow"><span class="f">Allergies or foods to avoid</span>' + multi('allergies', [['egg', 'Eggs'], ['fish', 'Fish'], ['peanut', 'Peanuts'], ['dairy', 'Dairy'], ['gluten', 'Gluten']], d.allergies) + '</div>';
    }
    if (stepErr) h += '<p class="err" role="alert">' + esc(stepErr) + '</p>';
    h += '<div class="sheetfoot"><button class="btn ghost" data-act="back"' + (step === 0 ? ' disabled' : '') + '>Back</button><button class="btn" data-act="next">' + (step === 4 ? 'Build my plan' : 'Next') + '</button></div></div>';
    $('#sheet').innerHTML = h;
  }
  function readSheet() {
    var imp = draft.units === 'imperial';
    var num = function (id) { var el = document.getElementById(id); if (!el) return undefined; var v = parseFloat(el.value); return isNaN(v) ? null : v; };
    var txt = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : undefined; };
    if (step === 0) {
      draft.name = txt('name'); var a = num('age'); if (a !== undefined) draft.age = a;
      if (imp) { var ft = num('hft'), inch = num('hin'); if (ft != null) draft.heightCm = (ft * 12 + (inch || 0)) * 2.54; }
      else { var hc = num('heightCm'); if (hc !== undefined) draft.heightCm = hc; }
      var w = num('weightKg'); if (w !== undefined) draft.weightKg = w == null ? null : (imp ? w / 2.20462 : w);
    } else if (step === 1) {
      ['neckCm', 'waistCm', 'hipCm'].forEach(function (k) { var v = num(k); if (v !== undefined) draft[k] = v == null ? null : (imp ? v * 2.54 : v); });
    } else if (step === 2) {
      var g = num('goalKg'); if (g !== undefined) draft.goalKg = g == null ? null : (imp ? g / 2.20462 : g);
    } else if (step === 4) {
      var rn = txt('regionName'); if (rn !== undefined) draft.regionName = rn;
      var cs = txt('currencySymbol'); if (cs !== undefined) draft.currencySymbol = cs || '$';
    }
  }
  function validate() {
    var d = draft;
    if (step === 0) {
      if (!d.sex) return 'Choose the sex used in the formulas.';
      if (!d.age || d.age < 13 || d.age > 100) return 'Enter an age between 13 and 100.';
      if (!d.heightCm || d.heightCm < 120 || d.heightCm > 230) return 'Enter a height between 120 and 230 cm (3 ft 11 in to 7 ft 6 in).';
      if (!d.weightKg || d.weightKg < 35 || d.weightKg > 300) return 'Enter a weight between 35 and 300 kg (77 to 660 lb).';
    }
    if (step === 1) {
      if (d.neckCm && d.waistCm && d.waistCm <= d.neckCm) return 'Waist should be bigger than neck. Check the numbers.';
      if (d.waistCm && (d.waistCm < 45 || d.waistCm > 200)) return 'That waist measurement looks off. Check the units.';
    }
    if (step === 2) {
      if (!d.goalKg || d.goalKg < 35 || d.goalKg > 300) return 'Enter a goal weight.';
      if (!d.days || !d.days.length) return 'Pick at least one training day.';
    }
    return '';
  }
  function finishSetup() {
    var d = draft;
    d.days = d.days.map(Number).sort();
    d.weightKg = Math.round(d.weightKg * 10) / 10; d.goalKg = Math.round(d.goalKg * 10) / 10;
    var first = !S.profile;
    var oldW = S.profile && S.profile.weightKg;
    S.profile = d;
    if (first) { S.startDate = TODAY; S.weights = [{ d: TODAY, kg: d.weightKg, waistCm: d.waistCm || undefined }]; }
    else if (oldW !== d.weightKg) { addWeight(TODAY, d.weightKg, null); }
    closeSetup(); save(); go('today'); toast(first ? 'Your plan is ready' : 'Plan updated');
  }
  function addWeight(d, kg, waist) {
    S.weights = S.weights.filter(function (w) { return w.d !== d; });
    var e = { d: d, kg: Math.round(kg * 10) / 10 }; if (waist) e.waistCm = Math.round(waist * 10) / 10;
    S.weights.push(e); S.weights.sort(function (a, b) { return a.d < b.d ? -1 : 1; });
    var latest = S.weights[S.weights.length - 1];
    S.profile.weightKg = latest.kg;
    if (latest.waistCm) S.profile.waistCm = latest.waistCm;
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act],[data-tab]'); if (!t) return;
    var a = t.dataset.act;
    if (!a && t.dataset.tab) { go(t.dataset.tab); return; }
    switch (a) {
      case 'tab': go(t.dataset.tab); break;
      case 'setup': openSetup(); break;
      case 'closesetup': closeSetup(); break;
      case 'seg': readSheet();
        var k = t.dataset.k, v = t.dataset.v;
        if (k.indexOf('parq') === 0) draft.parq[+k.slice(4)] = v === 'yes';
        else if (k === 'pregnant') draft.pregnant = v === 'yes';
        else draft[k] = v;
        renderSheet(); break;
      case 'multi': readSheet();
        var mk = t.dataset.k, mv = mk === 'days' ? Number(t.dataset.v) : t.dataset.v;
        var arr = draft[mk] = (draft[mk] || []).slice(); var ix = arr.indexOf(mv);
        if (ix >= 0) arr.splice(ix, 1); else arr.push(mv);
        renderSheet(); break;
      case 'next': readSheet(); stepErr = validate(); if (stepErr) { renderSheet(); break; } if (step === 4) finishSetup(); else { step++; renderSheet(); $('#sheet').scrollTop = 0; } break;
      case 'back': readSheet(); stepErr = ''; step = Math.max(0, step - 1); renderSheet(); break;
      case 'set': if (needSetup()) break;
        var dd = day(TODAY), n = +t.dataset.n, ex = t.dataset.ex;
        dd.sets[ex] = (dd.sets[ex] || 0) >= n ? n - 1 : n; save(); render(); break;
      case 'done': if (needSetup()) break; day(TODAY).done = true; trim(); save(); render(); toast('Workout logged. Nice work.'); break;
      case 'undone': day(TODAY).done = false; save(); render(); break;
      case 'habit': if (needSetup()) break; var hd = day(TODAY); hd.habits[t.dataset.h] = !hd.habits[t.dataset.h]; save(); render(); break;
      case 'fd': foodDate = OM.addDays(foodDate, +t.dataset.n); render(); break;
      case 'swap': if (needSetup()) break; var sw = S.swaps[foodDate] = S.swaps[foodDate] || {}; sw[t.dataset.slot] = (sw[t.dataset.slot] || 0) + 1; save(); render(); break;
      case 'tick': if (needSetup()) { t.checked = false; break; } var tk = S.shopTicks[shopStart()] = S.shopTicks[shopStart()] || {}; tk[t.dataset.id] = t.checked; save(); render(); break;
      case 'editprice': if (needSetup()) break; editPrice = t.dataset.id; render(); var inp = document.getElementById('price-' + editPrice); if (inp) inp.focus(); break;
      case 'cancelprice': editPrice = null; render(); break;
      case 'saveprice':
        var pid = t.dataset.id, pv = parseFloat(document.getElementById('price-' + pid).value);
        if (!(pv >= 0)) { toast('Enter a price of 0 or more'); break; }
        var reg = P().region; S.prices[reg] = S.prices[reg] || {}; S.prices[reg][pid] = { pr: pv, date: niceDate(TODAY, { day: 'numeric', month: 'short', year: 'numeric' }) };
        editPrice = null; save(); render(); toast('Price saved'); break;
      case 'resetprice': var rg = P().region; if (S.prices[rg]) delete S.prices[rg][t.dataset.id]; editPrice = null; save(); render(); break;
      case 'logw': if (needSetup()) break;
        var dv = $('#w-date').value || TODAY, kgv = parseFloat($('#w-kg').value), wv = parseFloat($('#w-waist').value);
        if (!(kgv > 0)) { toast('Enter your weight'); break; }
        var kg = imperial() ? kgv / 2.20462 : kgv; var wc = wv > 0 ? (imperial() ? wv * 2.54 : wv) : null;
        if (kg < 30 || kg > 320) { toast('That weight looks off. Check the units.'); break; }
        addWeight(dv > TODAY ? TODAY : dv, kg, wc); save(); render(); toast('Weigh-in saved'); break;
      case 'delw': S.weights = S.weights.filter(function (w) { return w.d !== t.dataset.d; }); if (S.weights.length) S.profile.weightKg = S.weights[S.weights.length - 1].kg; save(); render(); break;
      case 'applyadj': if (needSetup()) break; S.kcalAdj = Math.max(-600, Math.min(600, (S.kcalAdj || 0) + Number(t.dataset.d))); S.adjDate = TODAY; save(); render(); toast('Calories updated'); break;
      case 'clearadj': S.kcalAdj = 0; S.adjDate = null; save(); render(); break;
      case 'reset1': confirmReset = true; render(); break;
      case 'reset0': confirmReset = false; render(); break;
      case 'reset2':
        confirmReset = false; S = freshState();
        try { localStorage.removeItem(LSKEY); } catch (e) { }
        if (store.kind === 'db') store.ref.delete().catch(function () { });
        go('today'); toast('Everything deleted'); break;
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.act === 'load') {
      if (needSetup()) { t.value = ''; return; }
      var dd = day(TODAY); dd.loads = dd.loads || {};
      var v = t.value.trim();
      dd.loads[t.dataset.ex] = v;
      if (v) {
        var cur = S.loads[t.dataset.ex], val = v + (/[a-z]/i.test(v) ? '' : ' ' + wUnit());
        var prev = cur && typeof cur === 'object' ? (cur.d === TODAY ? cur.prev : { v: cur.v, d: cur.d }) : null;
        S.loads[t.dataset.ex] = { v: val, d: TODAY, prev: prev || null };
      }
      save();
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSetup(); });

  var h0 = (location.hash || '').slice(1);
  if (VALID_TABS.indexOf(h0) >= 0) tab = h0;
  initStore();
})();
</script>
</body>
